<!DOCTYPE html>
<html>
<head>
<title>Patients</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3") no-repeat center center/cover;
  min-height: 100vh;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding: 20px;
  color: white;
}

h1 { text-align: center; }

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  margin: 0 auto 15px auto;
  flex-wrap: wrap;
  gap: 10px;
}

.back-btn {
  text-decoration: none;
  background: #607D8B;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
}

.back-btn:hover { background: #455A64; }

.search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

#search {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  width: 260px;
}

#searchBtn {
  padding: 8px 14px;
  background: #2196F3;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

#searchBtn:hover { background: #1565C0; }

#clearBtn {
  padding: 8px 14px;
  background: #78909C;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

table {
  width: 95%;
  margin: auto;
  border-collapse: collapse;
  background: white;
  color: black;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border: 1px solid #ddd;
  text-align: center;
}

th { background: #2196F3; color: white; }

tr:hover { background: #e3f2fd; }

.del-btn {
  background: #f44336;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

.del-btn:hover { background: #c62828; }
</style>
</head>

<body>

<div class="overlay">

<h1>🧑 Patient Details</h1>

<div class="top-bar">
  <a href="index.html" class="back-btn">⬅ Back to Home</a>
  <div class="search-row">
    <input id="search" placeholder="🔍 Search by name or disease...">
    <button id="searchBtn" onclick="searchPatients()">Search</button>
    <button id="clearBtn" onclick="loadAll()">Clear</button>
  </div>
</div>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Gender</th>
  <th>Age</th>
  <th>Disease</th>
  <th>Join Date</th>
  <th>Blood Group</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="p"></tbody>
</table>

</div>

<script>
function renderPatients(data) {
    let html = "";
    data.forEach(p => {
        const date = p.join_date ? p.join_date.split("T")[0] : "-";
        html += `
        <tr>
            <td>${p.patient_id}</td>
            <td>${p.name}</td>
            <td>${p.gender}</td>
            <td>${p.age}</td>
            <td>${p.disease}</td>
            <td>${date}</td>
            <td>${p.blood_group}</td>
            <td>
              <button class="del-btn"
                onclick="deletePatient(${p.patient_id}, '${p.name}')">
                🗑️ Delete
              </button>
            </td>
        </tr>`;
    });
    document.getElementById("p").innerHTML = html || "<tr><td colspan='8'>No patients found.</td></tr>";
}

function loadAll() {
    document.getElementById("search").value = "";
    fetch("/patients")
    .then(res => res.json())
    .then(data => renderPatients(data))
    .catch(() => {
        document.getElementById("p").innerHTML = "<tr><td colspan='8'>⚠️ Could not load. Is server running?</td></tr>";
    });
}

function searchPatients() {
    const q = document.getElementById("search").value.trim();
    if (!q) { loadAll(); return; }
    fetch("/searchPatient?q=" + encodeURIComponent(q))
    .then(res => res.json())
    .then(data => renderPatients(data));
}

// Search on Enter key
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("search").addEventListener("keyup", function(e) {
        if (e.key === "Enter") searchPatients();
    });
});

function deletePatient(id, name) {
    const pwd = prompt(`🔐 Enter admin password to delete patient: ${name}`);
    if (!pwd) return;

    fetch("/deletePatient/" + id, {
        method: "DELETE",
        headers: { "x-admin-password": pwd }
    })
    .then(res => {
        if (res.status === 401) return res.json().then(e => { throw new Error(e.error); });
        return res.text();
    })
    .then(msg => {
        alert("✅ " + msg);
        loadAll();
    })
    .catch(err => alert("❌ " + err.message));
}

window.onload = loadAll;
</script>

</body>
</html>
