<!DOCTYPE html>
<html>
<head>
<title>Appointments</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url("https://images.unsplash.com/photo-1580281657527-47f249e8f2a4") no-repeat center center/cover;
  min-height: 100vh;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding: 20px;
  color: white;
}

h1 { text-align: center; }

/* BACK + SEARCH ROW */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  margin: 0 auto 15px auto;
}

.back-btn {
  text-decoration: none;
  background: #607D8B;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
}

.back-btn:hover { background: #455A64; }

#search {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  width: 260px;
}

table {
  width: 95%;
  margin: auto;
  border-collapse: collapse;
  background: white;
  color: black;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border: 1px solid #ddd;
  text-align: center;
}

th { background: #FF9800; color: white; }

tr:hover { background: #fff3e0; }

.cancel-btn {
  background: #f44336;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

.cancel-btn:hover { background: #c62828; }
</style>
</head>

<body>

<div class="overlay">

<h1>📅 Appointment Details</h1>

<div class="top-bar">
  <a href="index.html" class="back-btn">⬅ Back to Home</a>
  <input id="search" placeholder="🔍 Search by patient or doctor..." onkeyup="filterTable()">
</div>

<table>
<thead>
<tr>
  <th>S.NO</th>
  <th>Patient Name</th>
  <th>Disease</th>
  <th>Doctor Name</th>
  <th>Specialization</th>
  <th>Date</th>
  <th>Bill (₹)</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="a"></tbody>
</table>

</div>

<script>
function loadAppointments() {
    fetch("http://localhost:3000/appointments")
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.forEach(a => {
            const date = a.appointment_date ? a.appointment_date.split("T")[0] : "-";
            html += `
            <tr>
                <td>${a.appointment_id}</td>
                <td>${a.patient_name}</td>
                <td>${a.disease || "-"}</td>
                <td>${a.doctor_name}</td>
                <td>${a.specialization}</td>
                <td>${date}</td>
                <td>₹${a.bill_amount || 0}</td>
                <td>
                  <button class="cancel-btn"
                    onclick="cancelAppointment(${a.appointment_id})">
                    ❌ Cancel
                  </button>
                </td>
            </tr>`;
        });
        document.getElementById("a").innerHTML = html || "<tr><td colspan='8'>No appointments found.</td></tr>";
    })
    .catch(() => {
        document.getElementById("a").innerHTML = "<tr><td colspan='8'>⚠️ Could not load data. Is server running?</td></tr>";
    });
}

function cancelAppointment(id) {
    if (!confirm("Cancel this appointment?")) return;
    fetch("http://localhost:3000/deleteAppointment/" + id, { method: "DELETE" })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        loadAppointments(); // refresh table
    });
}

function filterTable() {
    const val = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll("#a tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
    });
}

window.onload = loadAppointments;
</script>

</body>
</html>
