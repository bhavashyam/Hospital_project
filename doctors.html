<!DOCTYPE html>
<html>
<head>
<title>Doctors</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url("https://images.unsplash.com/photo-1579684385127-1ef15d508118") no-repeat center center/cover;
  min-height: 100vh;
}

.overlay {
  background: rgba(0,0,0,0.7);
  min-height: 100vh;
  padding: 20px;
  color: white;
}

h1 { text-align: center; }

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  margin: 0 auto 15px auto;
  flex-wrap: wrap;
  gap: 10px;
}

.back-btn {
  text-decoration: none;
  background: #607D8B;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
}

.back-btn:hover { background: #455A64; }

#search {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  width: 260px;
}

/* TABLE */
table {
  width: 95%;
  margin: auto;
  border-collapse: collapse;
  background: white;
  color: black;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border: 1px solid #ddd;
  text-align: center;
}

th { background: #4CAF50; color: white; }

tr:hover { background: #f1f8e9; }
</style>
</head>

<body>

<div class="overlay">

<h1>👨‍⚕️ Doctors List</h1>

<div class="top-bar">
  <a href="index.html" class="back-btn">⬅ Back to Home</a>
  <input id="search" placeholder="🔍 Search by name or specialization..." onkeyup="filterTable()">
</div>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Specialization</th>
  <th>Email</th>
  <th>From</th>
  <th>To</th>
  <th>Room</th>
</tr>
</thead>

<tbody id="d"></tbody>
</table>

</div>

<script>
window.onload = function(){
    fetch("http://localhost:3000/doctors")
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.forEach(d => {
            html += `
            <tr>
                <td>${d.doctor_id}</td>
                <td>${d.name}</td>
                <td>${d.specialization}</td>
                <td>${d.email}</td>
                <td>${d.availability_from}</td>
                <td>${d.availability_to}</td>
                <td>${d.room_no}</td>
            </tr>`;
        });
        document.getElementById("d").innerHTML = html;
    })
    .catch(() => {
        document.getElementById("d").innerHTML = "<tr><td colspan='7'>⚠️ Could not load. Is server running?</td></tr>";
    });
};

function filterTable() {
    const val = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll("#d tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
    });
}
</script>

</body>
</html>
